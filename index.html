<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0d0f" />
    <meta
      name="description"
      content="STATION — an all-source intelligence training command center. Real research, realistic tasking, rigorous tradecraft feedback. Runs offline."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>STATION // All-Source</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0d0f;
        color: #dce7e6;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      #boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        gap: 14px;
      }
      #boot .mark {
        width: 54px;
        height: 54px;
        border: 1px solid #2a3a40;
        border-radius: 50%;
        display: grid;
        place-items: center;
        margin: 0 auto;
        color: #e8b35a;
        font: 600 13px/1 Consolas, monospace;
        letter-spacing: 0.12em;
      }
      #boot .line {
        font: 11px/1 Consolas, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #71888c;
      }
      #boot .bar {
        width: 180px;
        height: 2px;
        background: #1e2a2e;
        overflow: hidden;
        margin: 2px auto 0;
      }
      #boot .bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #e8b35a;
        animation: bootscan 1.1s ease-in-out infinite;
      }
      @keyframes bootscan {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="mark">STN</div>
        <div class="line">Establishing station</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <noscript>
      <p style="padding: 2rem; font-family: monospace">
        STATION requires JavaScript. All data is stored locally in your browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
